<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily Lam</title>
<meta name="description" content="Science communicator, event producer and drawer in Hong Kong. Book a meeting, find my links, or get to know me.">
<meta name="theme-color" content="#F6F8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1D1A" media="(prefers-color-scheme: dark)">

<meta property="og:image:width" content="1200">

<meta property="og:description" content="Science communicator · Event producer">
<meta property="og:url" content="https://emilylam.hk">
<meta property="og:type" content="website">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
:root{--bg:#F6F8F3;--surface:#FFFFFF;--ink:#16210F;--muted:#55624C;--line:#D5DDCC;--soft:#EAF3DE;--soft-ink:#27500A;--primary:#3B6D11;--icon:#3B6D11;--scrim:rgba(22,33,15,.55);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1B1D1A;--surface:#232621;--ink:#EEF1EA;--muted:#A9B2A2;--line:#3B4038;--soft:#EAF3DE;--soft-ink:#27500A;--primary:#3B6D11;--icon:#7BC04A;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;zoom:.9}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:var(--ink)}a:hover{color:var(--icon)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--icon);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 20px calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:6px}
.who{min-width:0;text-align:right;display:flex;flex-direction:column;gap:2px}
.who h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.who p{margin:0;font-size:14px;color:var(--muted)}
.lang{position:relative;flex:0 0 auto}
.lang-btn{min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:14px;font-weight:600}
.lang-menu{position:absolute;top:46px;left:0;z-index:30;min-width:168px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(22,33,15,.14);display:flex;flex-direction:column;gap:2px}
.lang-menu button{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font-size:15px;font-weight:600;text-align:left}
.lang-menu button[aria-checked="true"]{background:var(--soft);color:var(--soft-ink)}
.lang-menu button[aria-checked="true"]::after{content:"✓"}
/* mascot */
.hello{display:flex;align-items:flex-start;gap:12px;margin-top:6px}
.bubble-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:6px}
.bubble{background:var(--soft);color:var(--soft-ink);border-radius:6px 18px 18px 18px;padding:12px 14px;font-weight:600;line-height:1.35;margin:0}
.know-link{align-self:flex-start;min-height:36px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--icon);text-decoration:none}
.flip{--s:112px;--iw:92px;--ib:6px;--pop:26px;flex:0 0 var(--s);width:var(--s);height:var(--s);padding:0;border:0;background:transparent;cursor:pointer;perspective:600px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.flip-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.flip.is-flipped .flip-in{transform:rotateY(180deg)}
.face{display:block;position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.front{border-radius:999px;background:var(--soft);overflow:hidden}
.face.front svg{width:100%;height:100%;display:block}
.face.back{transform:rotateY(180deg)}
.face.back .disc{display:block;position:absolute;inset:0;border-radius:999px;background:#D3E9C1}
.face.back img{position:absolute;left:50%;bottom:var(--ib);width:var(--iw);height:auto;transform:translateX(-50%) translateY(var(--pop)) scale(.85);transition:transform .45s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(22,33,15,.18))}
.flip.is-flipped .face.back img{transform:translateX(-50%) translateY(0) scale(1);transition-delay:.3s}
.flip.lg{--s:120px;--iw:98px;--ib:7px;--pop:28px;margin-top:18px}
.flip.sm{--s:72px;--iw:59px;--ib:4px;--pop:16px}
/* rows */
.book{min-height:72px;display:flex;align-items:center;gap:14px;padding:14px 18px;margin-top:4px;background:var(--primary);color:#fff;border-radius:16px;text-decoration:none}
.book:hover{color:#fff;filter:brightness(1.08)}
.book .t{flex:1;display:flex;flex-direction:column}
.book .t b{font-weight:600;font-size:18px;line-height:1.25}
.book .t span{font-size:14px}
.row{width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:12px 18px;background:transparent;border:1px solid var(--line);border-radius:16px;cursor:pointer;text-align:left;text-decoration:none;color:var(--ink)}
.row .label{flex:1;font-weight:600;font-size:17px}
.chev{transition:transform .2s}
[aria-expanded="true"] > .chev{transform:rotate(180deg)}
[aria-expanded="true"] > .chev-r{transform:rotate(90deg)}
.panel{border:1px solid var(--line);border-radius:16px;padding:4px 18px;background:var(--surface);display:flex;flex-direction:column}
.panel.pad-b{padding-bottom:16px}
.item{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;font-weight:600;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;padding:0;cursor:pointer;text-align:left;width:100%;font-size:16px;color:var(--ink)}
.item:last-child{border-bottom:0}
.item .sub{font-weight:400;color:var(--muted)}
.subs{padding:4px 0 8px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.subs a{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted);text-decoration:none}
.subs a b{font-weight:600;color:var(--icon)}
.soft-btn{margin-top:8px;min-height:48px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--soft-ink);border-radius:12px;text-decoration:none;font-weight:700}
.soft-btn:hover{color:var(--soft-ink)}
.qa{border-top:1px solid var(--line);margin-top:6px;padding-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa a,.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;font-size:14px;color:var(--muted);background:transparent;border:0;padding:0;cursor:pointer;text-align:center}
.qa .ic{width:60px;height:60px;border-radius:999px;background:var(--soft);display:flex;align-items:center;justify-content:center}
/* subpages */
.backlink{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:15px;color:var(--muted)}
.title{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.chat{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.me{align-self:flex-end;max-width:80%;background:var(--primary);color:#fff;border-radius:18px 6px 18px 18px;padding:10px 14px;font-size:15px;font-weight:600;margin:0;animation:pop .25s ease-out both}
.it{align-self:flex-start;max-width:85%;background:var(--soft);color:var(--soft-ink);border-radius:6px 18px 18px 18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;animation:pop .3s ease-out .15s both}
.it p{margin:0;font-weight:600;line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts a{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;background:#fff;color:#27500A;border-radius:999px;text-decoration:none;font-size:14px;font-weight:700}
.li{align-self:flex-start;max-width:85%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(22,33,15,.12);animation:pop .3s ease-out .45s both}
.li .logo{flex:0 0 36px;height:36px;border-radius:8px;background:#0A66C2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.li span{flex:1;font-size:14px;color:var(--muted)}
.li a{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;background:var(--primary);color:#fff;border-radius:999px;text-decoration:none;font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--icon);background:transparent;cursor:pointer;font-size:15px;font-weight:600}
.link-btn{align-self:flex-end;min-height:44px;padding:0 12px;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;text-decoration:underline}
.cta{min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;margin-top:6px;background:var(--primary);color:#fff;border-radius:16px;text-decoration:none;font-weight:600;font-size:17px;border:0;cursor:pointer;width:100%}
.cta:hover{color:#fff;filter:brightness(1.08)}
.still{animation:none!important}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* form */
fieldset{margin:0;padding:0;border:0}
legend{padding:0 0 10px;font-weight:700;font-size:15px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{position:relative;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:15px;font-weight:600}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick label::before{content:"+"}
.pick label:has(input:checked){background:var(--soft);border-color:var(--soft);color:var(--soft-ink)}
.pick label:has(input:checked)::before{content:"✓"}
.pick label:has(input:focus-visible){outline:3px solid var(--icon);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.err{margin:0;padding:12px 14px;border-radius:12px;background:#FCEBE8;color:#7A1F14;font-weight:600;font-size:15px}
.hp{position:absolute;left:-9999px}
.stack{display:flex;flex-direction:column;gap:14px}
.steplabel{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.field input.code{min-height:64px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:28px;font-weight:600;letter-spacing:.45em;text-align:center}
.textbtn{min-height:44px;padding:0;background:transparent;border:0;color:var(--icon);cursor:pointer;font-size:15px;font-weight:600}
.doc-open{font-size:14px;color:var(--icon)}
.linkrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0}
.linkrow .item{flex:1;border-bottom:0}
.qrmini{flex:0 0 44px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:transparent;cursor:pointer}
.dialog.qrcard{padding:0;overflow:hidden;gap:0}
.qrcard .solid{background:var(--qr);color:var(--qr-ink)}
.qrhead{width:100%;display:flex;align-items:center;gap:12px;padding:18px 20px;background:var(--qr);color:var(--qr-ink)}
.qrhead h2{margin:0;font-size:19px;color:inherit;text-align:left;word-break:break-word}
.qrbadge{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.qrbadge img{width:100%;height:100%;object-fit:cover}
.qrbody{width:100%;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.qrwrap{position:relative;padding:18px;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 3px var(--qr)}
#qrSvg svg{display:block;width:208px;height:208px}
.qrcenter{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:5px;display:flex}
.qrcenter .dot{flex:1;border-radius:10px;background:var(--qr);display:flex;align-items:center;justify-content:center;overflow:hidden}
.qrcenter img{width:100%;height:100%;object-fit:contain}
.qrurl{margin:0;font-weight:600;font-size:15px;text-align:center;word-break:break-all}
.qrrow{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qrbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:4px}
.photos a{display:block;border-radius:12px;overflow:hidden;background:var(--soft)}
.photos a:first-child:nth-last-child(odd){grid-column:1/-1}
.photos img{display:block;width:100%;height:100%;aspect-ratio:4/3;object-fit:cover}
/* log */
.post{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.post time{font-size:13px;color:var(--muted)}
.post h2{margin:0;font-size:18px}
.post p{margin:0;white-space:pre-line}
/* dialogs */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.bottom{align-items:flex-end;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.dialog{width:100%;max-width:340px;background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.scrim.bottom .dialog{max-width:420px;align-items:stretch;text-align:left}
.dialog h2{margin:0;font-size:19px;font-weight:700}
.qrbox{padding:14px;background:#fff;border-radius:16px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.apps a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none}
.apps a span{width:52px;height:52px;border-radius:999px;background:var(--soft);color:#27500A;display:flex;align-items:center;justify-content:center;font-weight:700}
.ghost{min-height:48px;background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;font-size:15px}
.solid{min-height:48px;width:100%;background:var(--primary);color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:700;font-size:16px}
.ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--ink)}
.ld-bg{position:absolute;inset:0;background:var(--bg)}
.ld-glow{position:absolute;left:50%;top:50%;width:min(420px,110vw);height:min(420px,110vw);transform:translate(-50%,-62%);border-radius:50%;background:radial-gradient(circle,rgba(108,191,71,.10) 0%,rgba(108,191,71,0) 70%);pointer-events:none}
.ld canvas{position:relative;display:block;width:min(240px,60vw);height:min(240px,60vw);transform-origin:0 0}
.ld h1{position:relative;margin:6px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.ld p{position:relative;margin:0;font-size:16px;color:var(--muted)}
.ld .ld-fallback{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));font-size:14px;color:var(--muted)}
.ld .ld-fallback a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="field"><label for="u-code" data-i18n="codeLabel"></label><input id="u-code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div>
<button type="submit" class="cta" style="margin-top:0;font-weight:700" data-i18n="verify"></button>
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px">
<button type="button" class="textbtn" id="uResend" data-i18n="resend"></button>
<button type="button" class="textbtn muted" id="uChange" data-i18n="changeEmail"></button>
</div>
</form>
<form id="uPw" class="stack" novalidate hidden>
<p class="muted" style="margin:0" data-i18n="pwIntro"></p>
<div class="field"><label for="u-pw" data-i18n="pwLabel"></label>
<div style="display:flex;gap:8px"><input id="u-pw" type="password" autocomplete="current-password" style="flex:1;min-width:0"><button type="button" class="ghost" id="uShow" style="min-width:68px;min-height:52px" data-i18n="show"></button></div></div>
<button type="submit" class="cta" style="margin-top:0;font-weight:700" data-i18n="unlockBtn"></button>
</form>
<div id="uDone" class="stack" hidden>
<div class="panel" id="uList"></div>
<button type="button" class="link-btn" style="align-self:center" id="uLock" data-i18n="lockAgain"></button>
</div>
<p class="err" id="uErr" role="alert" hidden></p>
<a class="row" href="#request" id="uAlt" style="min-height:60px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--icon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-6z"/></svg>
<span style="flex:1;display:flex;flex-direction:column"><b style="font-weight:700" data-i18n="noPw"></b><span class="muted" style="font-size:14px" data-i18n="noPwSub"></span></span>
</a>
</div>

<div id="reqWrap" hidden>
<div id="reqForm">
<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:20px">
<h1 class="title" data-i18n="reqTitle"></h1>
<p class="muted" style="margin:0" data-i18n="unlockBody"></p>
</div>
<form id="requestForm" novalidate style="display:flex;flex-direction:column;gap:20px">
<p class="hp"><label>Leave empty <input name="bot" tabindex="-1" autocomplete="off"></label></p>
<fieldset>
<legend data-i18n="which"></legend>
<div class="pick" id="docPick"></div>
</fieldset>
<div class="field"><label for="rq-name" data-i18n="yourName"></label><input id="rq-name" name="name" type="text" autocomplete="name" required></div>
<div class="field"><label for="rq-email" data-i18n="yourEmail"></label><input id="rq-email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="rq-org" data-i18n="org"></label><input id="rq-org" name="organisation" type="text" autocomplete="organization"></div>
<p class="muted" style="margin:0;font-size:14px" data-i18n="privacyNote"></p>
<p class="err" id="reqErr" role="alert" hidden></p>
<button type="submit" class="cta" style="margin-top:0;font-weight:700" id="reqSend" data-i18n="send"></button>
</form>
</div>
<div id="reqDone" class="center" style="gap:16px;padding-top:12px" hidden>
<p class="muted" style="margin:0" id="reqDoneText"></p>
<a class="cta" href="#" data-i18n="backHome"></a>
</div>
</div>
</section>

    if (Math.abs(a[0] - b[0]) > 9) { const lo = Math.min(a[0], b[0]), hi = Math.max(a[0], b[0]); ctx.moveTo(lo + 4, a[1]); ctx.lineTo(hi - 4, a[1]); }
  }
  ctx.stroke();
  strand(1, true, pal.b, 5.5); strand(0, true, pal.a, 5.5);
}

/* ---------- "Book a meeting": fade into the loading screen while the DNA flies to the centre ---------- */
const MEET = '/meet/';
const GCAL = 'https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3iCvLEry0QMnr41BlCxDMPS_ZZ3TkMqB-KLZCixdSQhLCKDb_dBBwV1WM_ytgoN84b_Qvh2gmy';
let leaving = false;
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="/meet/"], a[href^="https://meet.emilylam.hk"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || leaving) return;
  e.preventDefault(); leaving = true; bookTransition();
});
function bookTransition() {
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ov = document.createElement('div'); ov.className = 'ld'; ov.setAttribute('role', 'status'); ov.setAttribute('aria-live', 'polite');
  ov.innerHTML = '<div class="ld-bg"></div><div class="ld-glow"></div><canvas aria-hidden="true"></canvas><h1>Emily Lam</h1><p></p><div class="ld-fallback"><a></a></div>';
  ov.querySelector('p').textContent = t().loading;
  const fb = ov.querySelector('.ld-fallback a'); fb.textContent = t().fallback; fb.href = GCAL;
  const bg = ov.querySelector('.ld-bg'), glow = ov.querySelector('.ld-glow'), cv = ov.querySelector('canvas');
  const texts = [ov.querySelector('h1'), ov.querySelector('p'), ov.querySelector('.ld-fallback')];
  bg.style.opacity = 0; glow.style.opacity = 0; texts.forEach(x => x.style.opacity = 0);
  document.body.appendChild(ov);
  const src = document.querySelector('[data-view]:not([hidden]) .flip');
  const to = cv.getBoundingClientRect(), z = (to.width / cv.offsetWidth) || 1;
  let from = null;
  if (src && !still) { const r = src.getBoundingClientRect(); if (r.width && r.bottom > 0 && r.top < innerHeight) from = r; }
  if (from) src.style.visibility = 'hidden';
  const FLY = still ? 0 : 560, FADE = 300, t0 = performance.now();
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  let phase = 0, last = t0, gone = false;
  function frame(now) {
    if (!ov.isConnected) return;
    const el = now - t0, dt = (now - last) / 1000; last = now;
    const e = FLY ? ease(Math.min(1, el / FLY)) : 1;
    bg.style.opacity = Math.min(1, el / FADE);
    glow.style.opacity = e;
    texts.forEach(x => x.style.opacity = Math.min(1, Math.max(0, (el - 180) / 320)));
    if (from) {
      const sc = from.width / to.width;
      cv.style.transform = 'translate(' + ((from.left - to.left) / z) * (1 - e) + 'px,' + ((from.top - to.top) / z) * (1 - e) + 'px) scale(' + (sc + (1 - sc) * e) + ')';
    } else cv.style.opacity = Math.min(1, el / FADE);
    if (!still) phase += dt * (2 * Math.PI / 2.2) * e;
    drawHelix(cv, { phase, tilt: (still ? 1 : e) * 25 * Math.PI / 180, disc: from ? 1 - e : 0, depth: still ? 1 : e, mix: still ? 1 : e });
    if (!gone && el >= Math.max(FLY, FADE) + 80) {
      gone = true;
      location.href = MEET + '?lang=' + lang + '&p=' + (phase % (2 * Math.PI)).toFixed(3);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// Coming back with the browser's back button: clear the loading screen.
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;
  document.querySelectorAll('.ld').forEach(x => x.remove());
  document.querySelectorAll('.flip').forEach(x => x.style.visibility = '');
  leaving = false;
});

/* ---------- routing ---------- */
function route(){
  const raw = (location.hash || '').replace('#', '');
  const [v, q] = raw.split('?');
  const name = v || 'home';
  const view = ['home', 'know', 'unlock', 'request', 'log'].includes(name) ? name : 'home';
  const section = view === 'request' ? 'unlock' : view;
  $$('[data-view]').forEach(s => s.hidden = s.dataset.view !== section);
  if (section === 'unlock') {
    const isReq = view === 'request';
    $('#uSteps').hidden = isReq; $('#reqWrap').hidden = !isReq;
    $('#uBack').setAttribute('href', isReq ? '#unlock' : '#');
    if (isReq) { $('#reqForm').hidden = false; $('#reqDone').hidden = true; $('#uBubble').textContent = t().unlockBubble; }
    else enterUnlock(new URLSearchParams(q || ''));
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
applyLang(); route();

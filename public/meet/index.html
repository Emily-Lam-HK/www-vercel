<!doctype html>

<style>
:root{--bg:#F6F8F3;--ink:#16210F;--muted:#55624C}
@media (prefers-color-scheme:dark){:root{--bg:#1B1D1A;--ink:#EEF1EA;--muted:#A9B2A2}}
html{background:var(--bg);-webkit-text-size-adjust:100%;zoom:.9}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--ink)}
.ld-bg{position:absolute;inset:0;background:var(--bg)}
.ld-glow{position:absolute;left:50%;top:50%;width:min(420px,110vw);height:min(420px,110vw);transform:translate(-50%,-62%);border-radius:50%;background:radial-gradient(circle,rgba(108,191,71,.10) 0%,rgba(108,191,71,0) 70%);pointer-events:none}
.ld canvas{position:relative;display:block;width:min(240px,60vw);height:min(240px,60vw);transform-origin:0 0}
.ld h1{position:relative;margin:6px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.ld p{position:relative;margin:0;font-size:16px;color:var(--muted)}
.ld .ld-fallback{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));font-size:14px;color:var(--muted)}
.ld .ld-fallback a{color:var(--muted)}
</style>
</head>
<body>
<main class="ld" role="status" aria-live="polite">
<div class="ld-bg"></div>
<div class="ld-glow"></div>
<canvas id="dna" aria-hidden="true"></canvas>
<h1>Emily Lam</h1>
<p id="msg">Taking you to the booking page…</p>
<div class="ld-fallback"><a id="fallback" href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3iCvLEry0QMnr41BlCxDMPS_ZZ3TkMqB-KLZCixdSQhLCKDb_dBBwV1WM_ytgoN84b_Qvh2gmy">Click here if you are not redirected</a></div>
</main>
<script>
const TARGET = 'https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3iCvLEry0QMnr41BlCxDMPS_ZZ3TkMqB-KLZCixdSQhLCKDb_dBBwV1WM_ytgoN84b_Qvh2gmy';
/* Spinning DNA: the same helix as the site's DNA icon, drawn in 3D and turned on its axis. */
function hexMix(a, b, k) {
  const pa = a.match(/\w\w/g).map(x => parseInt(x, 16)), pb = b.match(/\w\w/g).map(x => parseInt(x, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
const HELIX_LIGHT = { a: '#3B6D11', b: '#6CBF47', r: '#A9D98C' };
const HELIX_DARK = { a: '#9ED07A', b: '#6CBF47', r: '#4E7F35' };
function sizeCanvas(cv) {
  const r = window.devicePixelRatio || 1, w = Math.max(1, Math.round(cv.clientWidth * r));
  if (cv.width !== w) { cv.width = w; cv.height = w; }
}
function drawHelix(cv, o) {
  sizeCanvas(cv);
  const ctx = cv.getContext('2d'), W = cv.width;
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const to = dark ? HELIX_DARK : HELIX_LIGHT, mix = o.mix || 0;
  const pal = { a: hexMix(HELIX_LIGHT.a, to.a, mix), b: hexMix(HELIX_LIGHT.b, to.b, mix), r: hexMix(HELIX_LIGHT.r, to.r, mix) };
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W); ctx.scale(W / 100, W / 100);
  if (o.disc > 0) { ctx.globalAlpha = o.disc; ctx.fillStyle = '#EAF3DE'; ctx.beginPath(); ctx.arc(50, 50, 50, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.translate(50, 50); ctx.rotate(o.tilt || 0); ctx.translate(-50, -50);
  const turns = 1.5, amp = 17, y0 = 16, y1 = 84, N = 140;
  const pt = (t, s) => { const th = 2 * Math.PI * turns * t + (o.phase || 0) + (s ? Math.PI : 0); return [50 + amp * Math.sin(th), y0 + (y1 - y0) * t, Math.cos(th)]; };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const strand = (s, front, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    let on = false, prev = null;
    for (let i = 0; i <= N; i++) {
      const p = pt(i / N, s), f = p[2] >= 0;
      if (f === front) { if (!on) { const q = prev || p; ctx.moveTo(q[0], q[1]); on = true; } ctx.lineTo(p[0], p[1]); }
      else { if (on) { ctx.lineTo(p[0], p[1]); } on = false; }
      prev = p;
    }
    ctx.stroke();
  };
  const back = 1 - 0.45 * (o.depth || 0);
  ctx.globalAlpha = back; strand(1, false, pal.b, 5.5); strand(0, false, pal.a, 5.5); ctx.globalAlpha = 1;
  ctx.strokeStyle = pal.r; ctx.lineWidth = 3.4; ctx.beginPath();
  for (let k = 0; k < 13; k++) {
    const t = (k + 0.5) / 13, a = pt(t, 0), b = pt(t, 1);
    if (Math.abs(a[0] - b[0]) > 9) { const lo = Math.min(a[0], b[0]), hi = Math.max(a[0], b[0]); ctx.moveTo(lo + 4, a[1]); ctx.lineTo(hi - 4, a[1]); }
  }
  ctx.stroke();
  strand(1, true, pal.b, 5.5); strand(0, true, pal.a, 5.5);
}

const q = new URLSearchParams(location.search);
const L = {"en": ["Taking you to the booking page…", "Click here if you are not redirected"], "zhHant": ["正在前往預約頁面…", "如果沒有自動跳轉，請按這裏"], "zhHans": ["正在前往预约页面…", "如果没有自动跳转，请点击这里"], "sv": ["Tar dig till bokningssidan…", "Klicka här om du inte skickas vidare"]};
const lang = L[q.get('lang')] ? q.get('lang') : 'en';
document.documentElement.lang = { en: 'en', zhHant: 'zh-Hant', zhHans: 'zh-Hans', sv: 'sv' }[lang];
document.getElementById('msg').textContent = L[lang][0];
document.getElementById('fallback').textContent = L[lang][1];

const cv = document.getElementById('dna');
const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
// Start in the homepage's colours, then fade slowly to white to meet the white booking page.
const FROM = dark ? { bg: '1B1D1A', ink: 'EEF1EA', muted: 'A9B2A2' } : { bg: 'F6F8F3', ink: '16210F', muted: '55624C' };
const TO = { bg: 'FFFFFF', ink: '16210F', muted: '55624C' };
const WAIT = 150, FADE = 1400, GO = 1100;
const root = document.documentElement.style, glow = document.querySelector('.ld-glow');
const words = [document.querySelector('.ld h1'), document.getElementById('msg'), document.querySelector('.ld-fallback')];
const smooth = (x) => x * x * (3 - 2 * x);
let phase = parseFloat(q.get('p')) || 0;
const t0 = performance.now(); let last = t0;
function frame(now) {
  if (!still) phase += (now - last) / 1000 * (2 * Math.PI / 2.2);
  last = now;
  const f = smooth(Math.min(1, Math.max(0, (now - t0 - WAIT) / FADE)));
  root.setProperty('--bg', hexMix(FROM.bg, TO.bg, f));
  // Text dips out at the halfway point and comes back in dark ink, so it never turns grey-on-grey.
  const side = f < 0.5 ? FROM : TO;
  root.setProperty('--ink', '#' + side.ink); root.setProperty('--muted', '#' + side.muted);
  const textOpacity = dark ? Math.min(1, Math.abs(1 - 2 * f) * 1.6) : 1;
  words.forEach((w) => { w.style.opacity = textOpacity; });
  glow.style.opacity = 1 - f;
  drawHelix(cv, { phase, tilt: 25 * Math.PI / 180, disc: 0, depth: 1, mix: 1 - f });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Leave once the page is mostly white; the DNA keeps spinning while the booking page loads.
setTimeout(() => location.replace(TARGET), GO);
</script>
</body>
</html>
